name: AI Test Generation

on:
  push:
    branches-ignore:
      - master

permissions:
  contents: read

jobs:
  generate-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pushed code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Set AI test base SHA
        run: |
          echo "AI_TEST_BASE_SHA=${{ github.event.before }}" >> "$GITHUB_ENV"

      - name: Run AI test generation
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python ai-test-bot/src/runner.py